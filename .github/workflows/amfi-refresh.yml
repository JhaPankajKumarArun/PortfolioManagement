name: Automatic AMFI refresh
on:
  schedule:
    - cron: '15 17 * * 1-6'
    - cron: '30 1 * * 1-6'
  workflow_dispatch:
  push:
    branches: [phase-4.3]
    paths: ['.github/workflows/amfi-refresh.yml']
permissions:
  contents: write
concurrency:
  group: amfi-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate official NAV feed
        env:
          PUBLISH: ${{ vars.AMFI_REDISTRIBUTION_ALLOWED }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r=await fetch('https://portal.amfiindia.com/spages/NAVAll.txt',{signal:AbortSignal.timeout(45000)});
          if(!r.ok)throw Error('AMFI HTTP '+r.status);
          const body=await r.text();
          const rows=body.split(/\r?\n/).map(x=>x.split(';')).filter(x=>/^\d+$/.test(x[0]?.trim())&&Number(x[4])>0&&/^\d{1,2}-[A-Za-z]{3}-\d{4}$/.test(x[5]?.trim()));
          if(rows.length<100)throw Error('Invalid AMFI response');
          console.log('Validated NAV rows:',rows.length);
          if(process.env.PUBLISH!=='true'){console.log('Public redistribution disabled pending permission verification');process.exit(0);}
          fs.mkdirSync('data',{recursive:true});
          fs.writeFileSync('data/amfi-nav.txt',body);
          JS
      - name: Publish changed feed
        if: vars.AMFI_REDISTRIBUTION_ALLOWED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/amfi-nav.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh validated AMFI NAV feed"
          git push origin HEAD
