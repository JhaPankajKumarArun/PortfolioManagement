name: Broker holdings (encrypted)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: broker-holdings
  cancel-in-progress: false
jobs:
  zerodha:
    if: github.ref == 'refs/heads/refactor/modular-architecture'
    environment: broker-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch and encrypt holdings
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_REQUEST_TOKEN: ${{ secrets.KITE_REQUEST_TOKEN }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          BROKER_EXPORT_PASSWORD: ${{ secrets.BROKER_EXPORT_PASSWORD }}
        run: |
          umask 077
          node broker-actions/zerodha.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: broker-encrypted
          path: broker-encrypted.json
          retention-days: 1
          if-no-files-found: error

      - name: Remove encrypted export from runner
        if: always()
        run: rm -f broker-encrypted.json
