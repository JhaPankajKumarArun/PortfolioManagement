name: Market data connectivity test
on:
  push:
    branches: [phase-4.3]
    paths:
      - '.github/workflows/market-data-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate AMFI NAV feed
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://portal.amfiindia.com/spages/NAVAll.txt', {signal: AbortSignal.timeout(30000)});
          if (!response.ok) throw new Error('AMFI HTTP '+response.status);
          const body = await response.text();
          const rows = body.split(/\r?\n/).map(x=>x.split(';')).filter(x=>/^\d+$/.test(x[0]) && Number(x[4])>0 && x.length>=6);
          if (rows.length<100) throw new Error('Unexpected NAV format or insufficient rows');
          console.log('Validated NAV rows:', rows.length);
          console.log('Sample NAV date:', rows[0][5]);
          JS
      - name: Check NSE Indices connectivity
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const r = await fetch('https://www.niftyindices.com/reports/historical-data', {signal: AbortSignal.timeout(30000)});
          console.log('NSE Indices HTTP:', r.status);
          if (!r.ok) throw new Error('NSE Indices unavailable');
          console.log('Page reachable; historical data endpoint and redistribution rights not yet validated.');
          JS
