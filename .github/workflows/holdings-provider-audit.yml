name: Holdings provider audit
on:
  workflow_dispatch:
  push:
    branches: [refactor/modular-architecture]
    paths: ['scripts/audit-holdings-providers.mjs', '.github/workflows/holdings-provider-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-holdings-providers.mjs
        env:
          EJI_API_KEY: ${{ secrets.EJI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holdings-provider-audit
          path: data/holdings-provider-audit.json
