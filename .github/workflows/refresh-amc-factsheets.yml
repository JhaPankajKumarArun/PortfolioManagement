name: Refresh AMC factsheet benchmarks
on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: amc-factsheets
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modular-architecture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install requests beautifulsoup4
      - run: python scripts/refresh_amc_factsheets.py
      - run: |
          git add data/factsheets/benchmarks.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public AMC benchmark facts'
          git push origin HEAD:refactor/modular-architecture
