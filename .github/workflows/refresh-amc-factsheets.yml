name: Refresh AMC fund intelligence
on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-amc-factsheets.yml'
      - 'scripts/refresh_amc_factsheets.py'
      - 'scripts/factsheet_metrics.py'
      - 'scripts/factsheet_adapters.py'
      - 'scripts/factsheet_schema.py'
      - 'scripts/factsheet_catalog.py'
      - 'scripts/factsheet_sources.py'
      - 'scripts/test_factsheet_metrics.py'
permissions:
  contents: write
concurrency:
  group: amc-factsheets
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install requests beautifulsoup4
      - run: python -m unittest discover -s scripts -p test_factsheet_metrics.py
      - run: python scripts/refresh_amc_factsheets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factsheet-coverage
          path: data/factsheets/coverage.json
          if-no-files-found: warn
      - run: |
          git add data/factsheets/benchmarks.json data/factsheets/coverage.json data/factsheets/fund-intelligence.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public AMC benchmark facts'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "Catalog conflict; refusing to overwrite concurrent changes."
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "Could not publish after three attempts."
          exit 1
