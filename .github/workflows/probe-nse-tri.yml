name: Probe NSE TRI connectivity
on:
  workflow_dispatch:
  push:
    branches: [refactor/modular-architecture]
    paths:
      - scripts/probe_nse_tri.py
      - .github/workflows/probe-nse-tri.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -u scripts/probe_nse_tri.py
