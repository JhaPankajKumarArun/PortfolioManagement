name: Live portfolio smoke test
on:
  push:
    branches: [phase-4.3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Check production and candidate in Chromium and WebKit
        run: |
          python3 -m http.server 8080 > /tmp/portfolio-server.log 2>&1 &
          node --input-type=module <<'JS'
          import {chromium,webkit} from 'playwright';
          import assert from 'node:assert/strict';
          let failed=false;
          for(const engine of [chromium,webkit]){
            const browser=await engine.launch();
            for(const url of ['https://jhapankajkumararun.github.io/PortfolioManagement/','http://localhost:8080/']){
              const context=await browser.newContext({viewport:{width:390,height:844}});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              try{
                const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                assert.ok(response?.ok(),'HTTP failure');
                await page.waitForTimeout(2500);
                assert.match(await page.title(),/portfolio/i);
                assert.ok(await page.locator('body').innerText(),'Empty page');
                assert.deepEqual(errors,[]);
                console.log(engine.name(),url,'PASS');
              }catch(e){failed=true;console.error(engine.name(),url,e.message);}
              finally{await context.close();}
            }
            await browser.close();
          }
          if(failed)process.exitCode=1;
          JS
