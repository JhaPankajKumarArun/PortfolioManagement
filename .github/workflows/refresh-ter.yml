name: Refresh public AMFI TER
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'
  push:
    branches: [refactor/modular-architecture]
    paths: ['scripts/refresh-ter.mjs', '.github/workflows/refresh-ter.yml']
permissions:
  contents: write
concurrency:
  group: public-amfi-ter
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modular-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/refresh-ter.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ter
          git diff --cached --quiet || git commit -m 'Refresh public AMFI TER snapshots'
          git pull --rebase origin refactor/modular-architecture
          git push origin HEAD:refactor/modular-architecture
