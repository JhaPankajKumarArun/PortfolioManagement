name: Benchmark provider refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * 1-5'
  push:
    branches: [phase-4.3]
    paths: ['.github/workflows/benchmark-refresh.yml']
permissions:
  contents: write
concurrency:
  group: benchmark-refresh-${{ github.ref }}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve licensed TRI series
        env:
          PROVIDER: ${{ vars.BENCHMARK_PROVIDER_URL }}
          TOKEN: ${{ secrets.BENCHMARK_PROVIDER_TOKEN }}
          ALLOWED: ${{ vars.BENCHMARK_REDISTRIBUTION_ALLOWED }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          if(process.env.ALLOWED!=='true'||!process.env.PROVIDER)throw Error('Configure a permitted TRI data provider before publishing');
          const base=new URL(process.env.PROVIDER);
          if(base.protocol!=='https:')throw Error('HTTPS provider required');
          const ids=['nifty50','nifty500','midcap150','smallcap250','sensex'];
          const output=[];
          for(const id of ids){
            const url=new URL(base);url.searchParams.set('index',id);url.searchParams.set('series','TRI');
            const r=await fetch(url,{headers:process.env.TOKEN?{Authorization:'Bearer '+process.env.TOKEN}:{},signal:AbortSignal.timeout(45000)});
            if(!r.ok)throw Error(id+' HTTP '+r.status);
            const j=await r.json();
            if(j.id!==id||j.series!=='TRI'||!Array.isArray(j.rows)||j.rows.length<2)throw Error(id+' invalid series');
            const today=new Date().toISOString().slice(0,10);
            if(j.rows.some((x,i)=>!Array.isArray(x)||!/^\d{4}-\d{2}-\d{2}$/.test(x[0])||x[0]>today||!Number.isFinite(x[1])||x[1]<=0||(i&&x[0]<=j.rows[i-1][0])))throw Error(id+' invalid rows');
            const path='data/benchmarks/'+id+'.json';
            const rows=new Map();
            if(fs.existsSync(path)){
              const old=JSON.parse(fs.readFileSync(path,'utf8'));
              if(old.id!==id||old.series!=='TRI')throw Error('Invalid existing cache');
              for(const row of old.rows)rows.set(row[0],row[1]);
            }
            for(const row of j.rows)rows.set(row[0],row[1]);
            output.push([path,{id,series:'TRI',rows:[...rows].sort((a,b)=>a[0].localeCompare(b[0]))}]);
          }
          fs.mkdirSync('data/benchmarks',{recursive:true});
          for(const [path,j] of output)fs.writeFileSync(path,JSON.stringify(j));
          JS
      - name: Commit updated benchmark history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/benchmarks
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh validated TRI history"
          git push origin HEAD
