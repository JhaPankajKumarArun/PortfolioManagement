name: Public disclosure refresh
on:
  workflow_dispatch:
  push:
    branches: [refactor/modular-architecture]
    paths:
      - 'scripts/sync-disclosures.mjs'
      - 'scripts/sync-official-disclosures.py'
      - 'js/services/providers/disclosures.mjs'
      - '.github/workflows/disclosures.yml'
  schedule:
    - cron: '30 2 12,15,20,25 * *'
permissions:
  contents: write
concurrency:
  group: public-disclosure-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modular-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 openpyxl
      - name: Collect official AMC spreadsheets
        continue-on-error: true
        run: python scripts/sync-official-disclosures.py
      - name: Collect supplemental public catalog
        continue-on-error: true
        run: node scripts/sync-disclosures.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -s data/disclosures.json ]; then echo 'No disclosure catalog generated'; exit 1; fi
          git add data/disclosures.json
          git diff --cached --quiet || git commit -m 'Refresh public mutual fund disclosures'
          git pull --rebase origin refactor/modular-architecture
          git push origin HEAD:refactor/modular-architecture
