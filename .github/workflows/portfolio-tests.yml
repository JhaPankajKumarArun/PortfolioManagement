name: Portfolio integration tests
on:
  workflow_dispatch:
  push:
    branches: [phase-4.3, refactor/modular-architecture]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all JavaScript syntax
        run: find js -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run every regression fixture
        shell: bash
        run: |
          failed=0
          for test in tests/*.mjs; do
            echo "::group::$test"
            if node "$test"; then
              echo "PASS $test"
            else
              echo "::error::FAIL $test"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
