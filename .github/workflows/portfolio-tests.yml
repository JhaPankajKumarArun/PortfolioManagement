name: Portfolio integration tests
on:
  push:
    branches: [phase-4.3, refactor/modular-architecture]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/core.mjs
      - run: node tests/engines.mjs
      - run: node tests/amfi.mjs

      - run: node tests/providers.mjs

      - run: node tests/state.mjs

      - run: node tests/ui.mjs
