name: Browser regression tests
on:
  push:
    branches: [refactor/modular-architecture]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/assets.mjs
      - run: npx playwright test
