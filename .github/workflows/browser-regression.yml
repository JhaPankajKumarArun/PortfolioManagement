name: Browser regression tests
on:
  workflow_dispatch:
  push:
    branches: [refactor/modular-architecture]
    paths-ignore:
      - 'data/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/assets.mjs
      - run: npx playwright test --reporter=line,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-report
          path: playwright-report/
          retention-days: 7
